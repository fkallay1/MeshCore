; ── Seeed XIAO nRF52840 + NiceRF LoRa2021F33-2G4 (Semtech LR2021) ─────────
; The board layer is reused from variants/xiao_nrf52 (same board, same
; XiaoNrf52Board class) - only target.cpp/target.h here differ, because the
; radio is an LR2021 instead of the SX1262. Module specifics (front-end RF
; switch, PA table, DIO map) live in src/helpers/radiolib/NiceRF_LoRa2021F33.h so
; a ProMicro variant can reuse them unchanged.
;
; Wiring (module pin -> XIAO pin), keeping the SX1262 layout of xiao_nrf52:
;   18 IRQ  -> D1      17 RESET -> D2      14 BUSY -> D3      13 NSS -> D4
;   12 SCK  -> D8      16 MISO  -> D9      15 MOSI -> D10
;    1 VCC  -> 3.0-5.5 V, see the power warning below
;    5 CE   -> tie HIGH (internal pull-up; only pull low for full power-down)
;    9 ANT  -> sub-GHz antenna     10 ANT-2G4 -> 2.4 GHz antenna (unused for now)
;
; POWER: the module draws <800 mA at 868 MHz / 1 W and <1200 mA at 433 MHz / 2 W.
; The XIAO 3V3 regulator cannot feed that - give the module its own supply and
; a generous bulk capacitor, and share ground with the XIAO.
;
; TX POWER: LORA_TX_POWER is interpreted as dBm AT THE MODULE OUTPUT via the
; interpolated PA table in NiceRF_LoRa2021F33.h (default 14 dBm). The table is
; derived from the datasheet, not measured - check it before relying on the
; absolute value. Define NICERF_LORA2021F33_STOCK_PA_TABLE to fall back to
; RadioLib's table, whose lowest step already drives this module to ~19 dBm.
[Xiao_nrf52_nicerf_lora2021f33]
extends = nrf52_base
board = seeed-xiao-afruitnrf52-nrf52840
board_build.ldscript = boards/nrf52840_s140_v7.ld
build_flags = ${nrf52_base.build_flags}
  ${sensor_base.build_flags}
  -I lib/nrf52/s140_nrf52_7.3.0_API/include
  -I lib/nrf52/s140_nrf52_7.3.0_API/include/nrf52
  -I variants/xiao_nrf52_nicerf_lora2021f33   ; MUST precede xiao_nrf52 - both dirs hold a target.h and ours has to win
  -I variants/xiao_nrf52                 ; only for XiaoNrf52Board.h / variant.h
  -UENV_INCLUDE_GPS
  -D NRF52_PLATFORM
  -D NRF52_POWER_MANAGEMENT
  -D XIAO_NRF52
  -D USE_LR2021
  -D RADIO_CLASS=CustomLR2021
  -D WRAPPER_CLASS=CustomLR2021Wrapper
  -D LR2021_IRQ_DIO=9              ; module pin 18 is LR2021 DIO9 (NiceRF support)
  -D LR2021_TCXO_VOLTAGE=3.3f      ; NiceRF demo: LR20XX_SYSTEM_TCXO_CTRL_3_3V
; TX power dial, same convention as MeshCore's other high-power boards: the
; number is nominal and the PA adds to it, 22 = maximum. With PA_OFFSET=8
; (the default in NiceRF_LoRa2021F33.h):  6 -> ~14 dBm, 14 -> ~22, 22 -> ~30 (1 W).
; 'set tx 23'..'set tx 30' do NOTHING - RadioLib rejects an LF request above
; +22 (checkOutputPower) and silently keeps the previous setting.
; Mind the supply (~310 mA at 22 dBm out, ~800 mA near 30) and the band limit:
; 869.4-869.65 MHz allows 500 mW ERP (27 dBm) at 10% duty, most other 868
; sub-bands only 25 mW ERP (14 dBm).
  -D LORA_TX_POWER=14              ; -> ~22 dBm at the module output
  -D MAX_LORA_TX_POWER=22
  -D P_LORA_TX_LED=11
  -D P_LORA_DIO_1=D1               ; module IRQ pin - name kept for RadioLib's Module()
  -D P_LORA_RESET=D2
  -D P_LORA_BUSY=D3
  -D P_LORA_NSS=D4
  -D P_LORA_SCLK=D8
  -D P_LORA_MISO=D9
  -D P_LORA_MOSI=D10
  -D PIN_WIRE_SCL=D6
  -D PIN_WIRE_SDA=D7
  -D PIN_LORA_CE=D5                ; module pin 5 (LDO enable); has an internal pull-up, we drive it for a deterministic state and a real power-down
  -D PIN_USER_BTN=PIN_BUTTON1
  -D DISPLAY_CLASS=NullDisplayDriver
; ── Firmware Patch RAM ────────────────────────────────────────────────────
; LR2021_PRAM_UPD compiles in the 2240 B firmware patch (Semtech, Clear BSD)
; and loads it right after radio init. Semtech DS Rev 2.1 s22.3: "using the
; chip without the PRAM can create performance issues and unexpected bugs. The
; use of the PRAM is therefore highly recommended." RadioLib does not load it
; yet, so the variant does - if a future RadioLib does, the load is skipped
; automatically (the loaded magic is checked first). Needs RADIOLIB_GODMODE,
; which the top-level platformio.ini already sets for every build.
  -D LR2021_PRAM_UPD=1
; ── 2.4 GHz: wired up but deliberately not enabled ───────────────────────
; Uncommenting NICERF_LORA2021F33_ENABLE_24G programs DIO7 (FEM supply) and DIO8
; (2.4 GHz PA) as well, and the LR2021 then switches the HF front-end itself.
; Before doing that, mind: RadioLib clamps HF chip power to -19..+12 dBm and
; NiceRF advise not to exceed +4, MAX_LORA_TX_POWER has to come down with it,
; the PA table above is sub-GHz only (2.4 GHz falls back to RadioLib's HF
; table), and the antenna belongs on module pin 10.
;  -D NICERF_LORA2021F33_ENABLE_24G=1
;  -D LORA_FREQ=2445.0
;  -D LORA_BW=203.0
build_src_filter = ${nrf52_base.build_src_filter}
  +<helpers/*.cpp>
  +<helpers/sensors>
  +<../variants/xiao_nrf52/XiaoNrf52Board.cpp>
  +<../variants/xiao_nrf52/variant.cpp>
  +<../variants/xiao_nrf52_nicerf_lora2021f33>
  +<helpers/ui/NullDisplayDriver.cpp>
  +<helpers/ui/MomentaryButton.cpp>
debug_tool = jlink
upload_protocol = nrfutil
lib_deps = ${nrf52_base.lib_deps}
  ${sensor_base.lib_deps}

[env:Xiao_nrf52_nicerf_lora2021f33_repeater]
extends = Xiao_nrf52_nicerf_lora2021f33
build_flags =
  ${Xiao_nrf52_nicerf_lora2021f33.build_flags}
  -D ADVERT_NAME='"Xiao LoRa2021F33 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Xiao_nrf52_nicerf_lora2021f33.build_src_filter}
  +<../examples/simple_repeater/*.cpp>

; Same repeater, but with the chip's DC-DC (SIMO) regulator enabled.
; Measured on this module: Rx current 20.5 -> 16.0 mA total, the module's own
; share ~11 -> ~6.5 mA (about 41%), so the SIMO inductor on LXA/LXB really is
; fitted even though NiceRF do not document it. DS s23.1 calls DC-DC "strongly
; recommended for battery-operated applications".
;
; Two caveats, which is why it is a separate env rather than the default:
;   - the chip resets to LDO, so it has to be set on every radio init, and the
;     datasheet lists "DCDC (SIMO) impact on sensitivity" for sub-GHz LoRa as a
;     limitation the PRAM fixes - do not enable SIMO without LR2021_PRAM_UPD.
;   - SetRegMode has to be re-applied after SetLoraModulationParams (erratum).
;     radio_init() covers the boot path, but a runtime SF/BW change ('tempradio',
;     'set sf') drops the chip back to LDO until the next init.
[env:Xiao_nrf52_nicerf_lora2021f33_repeater_simo]
extends = env:Xiao_nrf52_nicerf_lora2021f33_repeater
build_flags =
  ${env:Xiao_nrf52_nicerf_lora2021f33_repeater.build_flags}
  -D NICERF_LORA2021F33_SIMO=1

; Bench diagnostics build - never ship this one.
;   fk info | simo on|off | ce <ms> | pram [load|on|off]   module level, target.cpp
;   fk rssi | win | hammer | reinit                        radio level, MyMesh.cpp
; FK_LRXXXX_STALE_COUNTER (fk stale/rlwait/rlretry) is NOT here: its counters live
; in our patched RadioLib, not in MeshCore, so it only links against that tree.
; FKPR_RADIO_WATCHDOG is the passive check interval in ms: RadioLibWrapper::loop()
; already reads RSSI ~32x a second for its noise floor, so min/max is collected
; there and the watchdog only reads the window (~960 samples per 30 s). No samples
; at all, or a spread of zero, three times in a row triggers a full radio_init().
[env:Xiao_nrf52_nicerf_lora2021f33_repeater_diag]
extends = env:Xiao_nrf52_nicerf_lora2021f33_repeater
build_flags =
  ${env:Xiao_nrf52_nicerf_lora2021f33_repeater.build_flags}
  -D FKPR_RADIO_WATCHDOG=30000
  -D FK_RADIO_DIAG_CLI=1
  -D FK_NICERF_LORA2021F33_TEST=1
  -D FK_RADIO_SPI_DIAG=1
  -D FK_SERIAL_WAIT_DTR=5000
