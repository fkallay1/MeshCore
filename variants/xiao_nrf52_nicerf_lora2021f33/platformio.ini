;en: ── Seeed XIAO nRF52840 + NiceRF LoRa2021F33-2G4 (Semtech LR2021) ─────────
;en: The board layer is reused from variants/xiao_nrf52 (same board, same
;en: XiaoNrf52Board class) - only target.cpp/target.h here differ, because the
;en: radio is an LR2021 instead of the SX1262. Module specifics (front-end RF
;en: switch, PA table, DIO map) live in src/helpers/radiolib/NiceRF_LoRa2021F33.h so
;en: a ProMicro variant can reuse them unchanged.
;en:
;en: Wiring (module pin -> XIAO pin), keeping the SX1262 layout of xiao_nrf52:
;en:   18 IRQ  -> D1      17 RESET -> D2      14 BUSY -> D3      13 NSS -> D4
;en:   12 SCK  -> D8      16 MISO  -> D9      15 MOSI -> D10
;en:    1 VCC  -> 3.0-5.5 V, see the power warning below
;en:    5 CE   -> tie HIGH (internal pull-up; only pull low for full power-down)
;en:    9 ANT  -> sub-GHz antenna     10 ANT-2G4 -> 2.4 GHz antenna (unused for now)
;en:
;en: POWER: the module draws <800 mA at 868 MHz / 1 W and <1200 mA at 433 MHz / 2 W.
;en: The XIAO 3V3 regulator cannot feed that - give the module its own supply and
;en: a generous bulk capacitor, and share ground with the XIAO.
;en:
;en: TX POWER: LORA_TX_POWER is interpreted as dBm AT THE MODULE OUTPUT via the
;en: interpolated PA table in NiceRF_LoRa2021F33.h (default 14 dBm). The table is
;en: derived from the datasheet, not measured - check it before relying on the
;en: absolute value. Define NICERF_LORA2021F33_STOCK_PA_TABLE to fall back to
;en: RadioLib's table, whose lowest step already drives this module to ~19 dBm.
;sk: ── Seeed XIAO nRF52840 + NiceRF LoRa2021F33-2G4 (Semtech LR2021) ─────────
;sk: Board vrstva je prevzatá z variants/xiao_nrf52 (rovnaká doska, rovnaká
;sk: trieda XiaoNrf52Board) - líši sa len target.cpp/target.h, lebo rádio je
;sk: LR2021 namiesto SX1262. Špecifiká modulu (RF switch, PA tabuľka, mapa DIO)
;sk: sú v src/helpers/radiolib/NiceRF_LoRa2021F33.h, aby ich vedel bezo zmeny použiť
;sk: aj budúci ProMicro variant.
;sk:
;sk: Zapojenie (pin modulu -> pin XIAO), drží sa rozloženia SX1262 z xiao_nrf52:
;sk:   18 IRQ  -> D1      17 RESET -> D2      14 BUSY -> D3      13 NSS -> D4
;sk:   12 SCK  -> D8      16 MISO  -> D9      15 MOSI -> D10
;sk:    1 VCC  -> 3,0-5,5 V, pozri upozornenie o napájaní nižšie
;sk:    5 CE   -> na HIGH (má pull-up; dole len pri úplnom vypnutí modulu)
;sk:    9 ANT  -> sub-GHz anténa     10 ANT-2G4 -> 2,4 GHz anténa (zatiaľ nevyužitá)
;sk:
;sk: NAPÁJANIE: modul berie <800 mA pri 868 MHz / 1 W a <1200 mA pri 433 MHz / 2 W.
;sk: Regulátor XIAO to nedá - modul potrebuje vlastný zdroj a poriadny bulk
;sk: kondenzátor, zem spoločnú s XIAO.
;sk:
;sk: VÝKON: LORA_TX_POWER sa cez interpolovanú PA tabuľku v NiceRF_LoRa2021F33.h
;sk: chápe ako dBm NA VÝSTUPE MODULU (default 14 dBm). Tabuľka je odvodená
;sk: z datasheetu, nie meraná - over ju, kým sa na absolútne číslo spoľahneš.
;sk: NICERF_LORA2021F33_STOCK_PA_TABLE prepne späť na tabuľku RadioLibu, ktorej
;sk: najnižší stupeň už tlačí modul na ~19 dBm.
[Xiao_nrf52_nicerf_lora2021f33]
extends = nrf52_base
board = seeed-xiao-afruitnrf52-nrf52840
board_build.ldscript = boards/nrf52840_s140_v7.ld
build_flags = ${nrf52_base.build_flags}
  ${sensor_base.build_flags}
  -I lib/nrf52/s140_nrf52_7.3.0_API/include
  -I lib/nrf52/s140_nrf52_7.3.0_API/include/nrf52
  -I variants/xiao_nrf52_nicerf_lora2021f33   ;en: MUST precede xiao_nrf52 - both dirs hold a target.h and ours has to win
  -I variants/xiao_nrf52                 ;en: only for XiaoNrf52Board.h / variant.h
  -UENV_INCLUDE_GPS
  -D NRF52_PLATFORM
  -D NRF52_POWER_MANAGEMENT
  -D XIAO_NRF52
  -D USE_LR2021
  -D RADIO_CLASS=CustomLR2021
  -D WRAPPER_CLASS=CustomLR2021Wrapper
  -D LR2021_IRQ_DIO=9              ;en: module pin 18 is LR2021 DIO9 (NiceRF support)
  -D LR2021_TCXO_VOLTAGE=3.3f      ;en: NiceRF demo: LR20XX_SYSTEM_TCXO_CTRL_3_3V
;en: TX power dial, same convention as MeshCore's other high-power boards: the
;en: number is nominal and the PA adds to it, 22 = maximum. With PA_OFFSET=8
;en: (the default in NiceRF_LoRa2021F33.h):  6 -> ~14 dBm, 14 -> ~22, 22 -> ~30 (1 W).
;en: 'set tx 23'..'set tx 30' do NOTHING - RadioLib rejects an LF request above
;en: +22 (checkOutputPower) and silently keeps the previous setting.
;en: Mind the supply (~310 mA at 22 dBm out, ~800 mA near 30) and the band limit:
;en: 869.4-869.65 MHz allows 500 mW ERP (27 dBm) at 10% duty, most other 868
;en: sub-bands only 25 mW ERP (14 dBm).
;sk: Ciferník výkonu, rovnaká konvencia ako ostatné výkonné dosky v MeshCore:
;sk: číslo je nominálne, PA si pripočíta svoje, 22 = maximum. Pri PA_OFFSET=8
;sk: (default v NiceRF_LoRa2021F33.h):  6 -> ~14 dBm, 14 -> ~22, 22 -> ~30 (1 W).
;sk: 'set tx 23'..'set tx 30' NEROBIA NIČ - RadioLib odmietne LF požiadavku nad
;sk: +22 (checkOutputPower) a ticho nechá pôvodnú hodnotu.
;sk: Pozor na zdroj (~310 mA pri 22 dBm, ~800 mA blízko 30) a na limit pásma:
;sk: 869,4-869,65 MHz dovoľuje 500 mW ERP (27 dBm) pri 10% duty, väčšina
;sk: ostatných 868 subpásiem len 25 mW ERP (14 dBm).
  -D LORA_TX_POWER=14              ;en: -> ~22 dBm at the module output
  -D MAX_LORA_TX_POWER=22
  -D P_LORA_TX_LED=11
  -D P_LORA_DIO_1=D1               ;en: module IRQ pin - name kept for RadioLib's Module()
  -D P_LORA_RESET=D2
  -D P_LORA_BUSY=D3
  -D P_LORA_NSS=D4
  -D P_LORA_SCLK=D8
  -D P_LORA_MISO=D9
  -D P_LORA_MOSI=D10
  -D PIN_WIRE_SCL=D6
  -D PIN_WIRE_SDA=D7
  -D PIN_LORA_CE=D5                ;en: module pin 5 (LDO enable); has an internal pull-up, we drive it for a deterministic state and a real power-down
  -D PIN_USER_BTN=PIN_BUTTON1
  -D DISPLAY_CLASS=NullDisplayDriver
;en: ── 2.4 GHz: wired up but deliberately not enabled ───────────────────────
;en: Uncommenting NICERF_LORA2021F33_ENABLE_24G programs DIO7 (FEM supply) and DIO8
;en: (2.4 GHz PA) as well, and the LR2021 then switches the HF front-end itself.
;en: Before doing that, mind: RadioLib clamps HF chip power to -19..+12 dBm and
;en: NiceRF advise not to exceed +4, MAX_LORA_TX_POWER has to come down with it,
;en: the PA table above is sub-GHz only (2.4 GHz falls back to RadioLib's HF
;en: table), and the antenna belongs on module pin 10.
;sk: ── 2,4 GHz: pripravené, ale zámerne nezapnuté ───────────────────────────
;sk: Odkomentovanie NICERF_LORA2021F33_ENABLE_24G naprogramuje aj DIO7 (napájanie FEM)
;sk: a DIO8 (2,4 GHz PA) a LR2021 si potom HF front-end prepína sám. Predtým
;sk: pozor: RadioLib klampuje HF výkon čipu na -19..+12 dBm a NiceRF odporúča
;sk: nejsť nad +4, treba znížiť aj MAX_LORA_TX_POWER, PA tabuľka vyššie platí len
;sk: pre sub-GHz (2,4 GHz spadne na HF tabuľku RadioLibu) a anténa patrí na pin 10.
;  -D NICERF_LORA2021F33_ENABLE_24G=1
;  -D LORA_FREQ=2445.0
;  -D LORA_BW=203.0
build_src_filter = ${nrf52_base.build_src_filter}
  +<helpers/*.cpp>
  +<helpers/sensors>
  +<../variants/xiao_nrf52/XiaoNrf52Board.cpp>
  +<../variants/xiao_nrf52/variant.cpp>
  +<../variants/xiao_nrf52_nicerf_lora2021f33>
  +<helpers/ui/NullDisplayDriver.cpp>
  +<helpers/ui/MomentaryButton.cpp>
debug_tool = jlink
upload_protocol = nrfutil
lib_deps = ${nrf52_base.lib_deps}
  ${sensor_base.lib_deps}

[env:Xiao_nrf52_nicerf_lora2021f33_repeater]
extends = Xiao_nrf52_nicerf_lora2021f33
build_flags =
  ${Xiao_nrf52_nicerf_lora2021f33.build_flags}
  -D ADVERT_NAME='"Xiao LoRa2021F33 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Xiao_nrf52_nicerf_lora2021f33.build_src_filter}
  +<../examples/simple_repeater/*.cpp>

;en: Repeater with LoRa-FOTA - same rules as Xiao_nrf52_repeater_fota
;en: (v7_extrafs ldscript, flasher at 0xEB000, FOTA FS at 0xD4000).
;en: custom_fota_device keeps the build archive separate from the SX1262 XIAO,
;en: which would otherwise share the 'xiao' prefix derived from the env name.
;sk: Repeater s LoRa-FOTA - rovnaké pravidlá ako Xiao_nrf52_repeater_fota
;sk: (v7_extrafs ldscript, flasher na 0xEB000, FOTA FS na 0xD4000).
;sk: custom_fota_device drží archív buildov oddelene od SX1262 XIAO, s ktorým by
;sk: inak zdieľal prefix 'xiao' odvodený z názvu envu.
[env:Xiao_nrf52_nicerf_lora2021f33_repeater_fota]
extends = Xiao_nrf52_nicerf_lora2021f33
board_build.ldscript = boards/nrf52840_s140_v7_extrafs.ld
board_upload.maximum_size = 708608
custom_fota_device = xiaonicerf
extra_scripts =
  create-uf2.py
  pre:test_nrf-fota/gen_build_info.py
  post:test_nrf-fota/gen_fw_trailer.py
  post:test_nrf-fota/gen_fotapkg_hook.py
build_flags =
  ${Xiao_nrf52_nicerf_lora2021f33.build_flags}
  -D ADVERT_NAME='"Xiao LoRa2021F33 Repeater FOTA"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;en: ── Bench testing (never ship enabled) ───────────────────────────────────
;en: RADIOLIB_GODMODE exposes RadioLib's private members - needed for
;en: setRegMode() (SIMO), writeRegMem32()/activatePram() (PRAM) and the PRAM
;en: status registers. It only changes access specifiers, nothing generated.
;en: FK_NICERF_LORA2021F33_TEST adds the 'fk …' CLI (info / simo / ce / pram).
;en: LR2021_PRAM_UPD compiles in the 2240 B firmware patch and loads it at boot.
;sk: ── Testovanie na stole (nikdy nenechať zapnuté v ostrom builde) ─────────
;sk: RADIOLIB_GODMODE sprístupní privátne členy RadioLibu - treba pre
;sk: setRegMode() (SIMO), writeRegMem32()/activatePram() (PRAM) a stavové
;sk: registre PRAM. Mení len prístupové špecifikátory, nič negeneruje.
;sk: FK_NICERF_LORA2021F33_TEST pridá CLI 'fk …' (info / simo / ce / pram).
;sk: LR2021_PRAM_UPD vloží 2240 B firmvérový patch a nahrá ho pri štarte.
;en: NICERF_LORA2021F33_SIMO switches the chip to the DC-DC (SIMO) regulator at init.
;en: Measured on this module: Rx total 20.5 -> 16.0 mA (module part ~11 -> ~6.5,
;en: about 41%), so the SIMO inductor is fitted even though NiceRF do not
;en: document it. The chip resets to LDO, so it has to be set on every init.
;en: Enable LR2021_PRAM_UPD together with it - the datasheet lists "DCDC (SIMO)
;en: impact on sensitivity" for sub-GHz LoRa as something the patch fixes.
;sk: NICERF_LORA2021F33_SIMO prepne čip pri inicializácii na DC-DC (SIMO) regulátor.
;sk: Namerané na tomto module: RX celkovo 20,5 -> 16,0 mA (samotný modul ~11 ->
;sk: ~6,5, teda asi 41 %), čiže cievka pre SIMO tam je, hoci to NiceRF nikde
;sk: neuvádza. Čip sa resetuje do LDO, preto sa to nastavuje pri každom štarte.
;sk: Zapínať spolu s LR2021_PRAM_UPD - datasheet uvádza "DCDC (SIMO) impact on
;sk: sensitivity" pre sub-GHz LoRa ako vec, ktorú patch opravuje.
;en: FK_RADIO_WATCHDOG = check interval in ms. The check itself is passive:
;en: RadioLibWrapper::loop() already reads RSSI ~32x a second for its noise
;en: floor, so min/max is collected there and the watchdog only reads the
;en: window (~960 samples per 30 s). No samples at all, or a spread of zero,
;en: three times in a row triggers a full radio_init(). Works on any board.
;sk: FK_RADIO_WATCHDOG = interval kontroly v ms. Samotna kontrola je pasivna:
;sk: RadioLibWrapper::loop() uz cita RSSI ~32x za sekundu pre svoj noise floor,
;sk: takze min/max sa zbiera tam a watchdog okno len precita (~960 vzoriek na
;sk: 30 s). Ziadne vzorky, alebo nulovy rozptyl, trikrat po sebe spustia plny
;sk: radio_init(). Funguje na kazdej doske.
  -D FK_RADIO_WATCHDOG=30000
  -D FK_RADIO_DIAG_ONLY=1        ;en: observation mode while we calibrate the threshold
  -D FK_RADIO_DIAG_CLI=1
  -D RADIOLIB_GODMODE=1
  -D FK_NICERF_LORA2021F33_TEST=1
  -D FK_RADIO_SPI_DIAG=1         ;en: 'fk stale' - A/B test of the stale-reply race
  -D LR2021_PRAM_UPD=1
  -D NICERF_LORA2021F33_SIMO=1
  -D WITH_LORA_FOTA=1
  -D FK_SERIAL_WAIT_DTR=5000       ;en: 5s (other envs use 2s) - bring-up board, the [LR2021] boot report is worth catching; only costs time when nothing is attached
  -D FOTA_MESHCORE_BUILD=1
  -D FOTA_DEBUG=1
  -D FK_DEBUG=1
  -Wl,-u,fw_id_trailer
  -D HPATCH_LITE_INCLUDE_DECOMPRESS=0
  -D FOTA_CHANNEL_NAME='"#fkotanrf"'
  -D FOTA_LANG_SK=1
  -I examples/simple_repeater/nrffota
  -I examples/simple_repeater/nrffota/hpatchlite
  -I test_nrf-fota
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Xiao_nrf52_nicerf_lora2021f33.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
  +<../examples/simple_repeater/nrffota/*.cpp>
  +<../examples/simple_repeater/nrffota/puff_stream.c>
  +<../examples/simple_repeater/nrffota/hpatchlite/hpatch_lite.c>
