[t1000-e]
extends = nrf52_base
board = tracker-t1000-e
board_build.ldscript = boards/nrf52840_s140_v7.ld
build_flags = ${nrf52_base.build_flags}
  -I src/helpers/nrf52
  -I lib/nrf52/s140_nrf52_7.3.0_API/include
  -I lib/nrf52/s140_nrf52_7.3.0_API/include/nrf52
  -I variants/t1000-e
  -I src/helpers/ui
  -D T1000_E
  -D PIN_USER_BTN=6
  -D USER_BTN_PRESSED=HIGH
  -D PIN_STATUS_LED=24
  -D RADIO_CLASS=CustomLR1110
  -D USE_LR1110
  -D WRAPPER_CLASS=CustomLR1110Wrapper
  -D LORA_TX_POWER=22
  -D RF_SWITCH_TABLE
  -D RX_BOOSTED_GAIN=true
  -D P_LORA_BUSY=7 ; P0.7
  -D P_LORA_SCLK=11 ; P0.11
  -D P_LORA_NSS=12 ; P0.12
  -D P_LORA_DIO_1=33 ; P1.1
  -D P_LORA_MISO=40 ; P1.8
  -D P_LORA_MOSI=41 ; P1.9
  -D P_LORA_RESET=42 ; P1.10
  -D LR11X0_DIO_AS_RF_SWITCH=true
  -D LR11X0_DIO3_TCXO_VOLTAGE=1.6
  -D ENV_INCLUDE_GPS=1
build_src_filter = ${nrf52_base.build_src_filter}
  +<helpers/*.cpp>
  +<helpers/nrf52/T1000eBoard.cpp>
  +<../variants/t1000-e>
debug_tool = jlink
upload_protocol = nrfutil

[env:t1000e_repeater]
extends = t1000-e
build_flags = ${t1000-e.build_flags}
  -I examples/companion_radio/ui-orig
  -D ADVERT_NAME='"t1000-e Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${t1000-e.build_src_filter}
  +<../examples/simple_repeater>
lib_deps = ${t1000-e.lib_deps}
  stevemarple/MicroNMEA @ ^2.0.6

;en: ── Repeater with LoRa-FOTA (delta-patch over LoRa, nRF52840 only) ────────
;en: Note: the FOTA flasher REQUIRES the app flash to end at 0xD4000 → v7_extrafs.ld
;en: (same as companion_radio). Flasher runs from 0xEB000, FOTA FS @ 0xD4000.
;en: T1000-E uses SoftDevice s140 v7 (app base 0x27000) — use the v7 ldscript.
;en: Before the first build generate the flasher blob:
;en:   python examples/simple_repeater/nrffota/tools/build_flasher.py  (one board-agnostic blob)
;en: Note: wire values stay unchanged for compatibility — channel '#fkotanrf'
;en: (hash 0xA4), FOTA_PKT_* bytes, FOTA_MAGIC. CLI accepts both 'ota' and 'fota'.
;sk: ── Repeater s LoRa-FOTA (delta-patch cez LoRa, len nRF52840) ─────────────
;sk: Pozn.: pre FOTA flasher MUSÍ app flash končiť na 0xD4000 → v7_extrafs.ld
;sk: (rovnako ako companion_radio). Flasher beží z 0xEB000, FOTA FS @ 0xD4000.
;sk: T1000-E má SoftDevice s140 v7 (app base 0x27000) — použi v7 ldscript.
;sk: Pred prvým buildom vygeneruj flasher blob:
;sk:   python examples/simple_repeater/nrffota/tools/build_flasher.py  (jeden board-agnostický blob)
;sk: Pozn.: wire hodnoty ostávajú pôvodné kvôli kompatibilite — kanál '#fkotanrf'
;sk: (hash 0xA4), FOTA_PKT_* bajty, FOTA_MAGIC. CLI prijíma 'ota' aj 'fota'.
[env:t1000e_repeater_fota]
extends = t1000-e
board_build.ldscript = boards/nrf52840_s140_v7_extrafs.ld
board_upload.maximum_size = 708608
extra_scripts =
  create-uf2.py                        ;en: registers the create_uf2 target (otherwise we override the one inherited from nrf52_base)
  pre:test_nrf-fota/gen_build_info.py
  post:test_nrf-fota/gen_fw_trailer.py
  post:test_nrf-fota/gen_fotapkg_hook.py
build_flags = ${t1000-e.build_flags}
  -I examples/companion_radio/ui-orig
  -D ADVERT_NAME='"T1000-E Repeater FOTA"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D WITH_LORA_FOTA=1
  -D FOTA_MESHCORE_BUILD=1
  -D FOTA_DEBUG=1                  ;en: FOTA diagnostics on Serial (FOTA_DEBUG_PRINT, nrffota/FotaDebug.h) — comment out to disable
  -D FK_DEBUG_STACKTRACE=1         ;en: TEMPORARY stack measurement in heartbeat — drop at the end (with the line below)
  -D INCLUDE_pxTaskGetStackStart=1 ;en: exposes the loop-stack bottom → current stack usage (nowused)
  -D FK_DEBUG=1                    ;en: RX diagnostics (ISR counter, CRC print) — comment out to disable
  ;en: Note: no -D FOTA_SOFTDEVICE_V7 needed — FOTA is board-agnostic:
  ;en: the FW takes the app base (v7=0x27000) from a linker symbol
  ;en: (fota_running_fw_base) and hands it to the flasher at runtime.
  ;sk: Pozn.: žiadny -D FOTA_SOFTDEVICE_V7 netreba — FOTA je board-agnostické:
  ;sk: app base (v7=0x27000) berie FW z linker symbolu (fota_running_fw_base) a
  ;sk: odovzdá ho flasheru runtime.
  -Wl,-u,fw_id_trailer            ;en: keep the FwId trailer with --gc-sections (nothing references it)
  -D HPATCH_LITE_INCLUDE_DECOMPRESS=0
  -D FOTA_CHANNEL_NAME='"#fkotanrf"'
  -D FOTA_LANG_SK=1                ;en: Slovak CLI reply texts (FotaTexts.h); without the flag = English
  -I examples/simple_repeater/nrffota
  -I examples/simple_repeater/nrffota/hpatchlite
  -I test_nrf-fota
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${t1000-e.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
  +<../examples/simple_repeater/nrffota/*.cpp>
  +<../examples/simple_repeater/nrffota/puff_stream.c>
  +<../examples/simple_repeater/nrffota/hpatchlite/hpatch_lite.c>
lib_deps = ${t1000-e.lib_deps}
  stevemarple/MicroNMEA @ ^2.0.6

[env:t1000e_room_server]
extends = t1000-e
build_flags = ${t1000-e.build_flags}
  -I examples/companion_radio/ui-orig
  -D ADVERT_NAME='"t1000-e Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
  -D RF_SWITCH_TABLE
build_src_filter = ${t1000-e.build_src_filter}
  +<../examples/simple_room_server>
lib_deps = ${t1000-e.lib_deps}
  stevemarple/MicroNMEA @ ^2.0.6

[env:t1000e_companion_radio_usb]
extends = t1000-e
board_build.ldscript = boards/nrf52840_s140_v7_extrafs.ld
board_upload.maximum_size = 708608
build_flags = ${t1000-e.build_flags}
  -I examples/companion_radio/ui-orig
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
  -D OFFLINE_QUEUE_SIZE=256
  -D DISPLAY_CLASS=NullDisplayDriver
  -D PIN_BUZZER=25
  -D PIN_BUZZER_EN=37      ; P1/5 - required for T1000-E
build_src_filter = ${t1000-e.build_src_filter}
  +<helpers/ui/buzzer.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-orig/*.cpp>
lib_deps = ${t1000-e.lib_deps}
  densaugeo/base64 @ ~1.4.0
  stevemarple/MicroNMEA @ ^2.0.6
  end2endzone/NonBlockingRTTTL@^1.3.0

[env:t1000e_companion_radio_ble]
extends = t1000-e
board_build.ldscript = boards/nrf52840_s140_v7_extrafs.ld
board_upload.maximum_size = 708608
build_flags = ${t1000-e.build_flags}
  -I examples/companion_radio/ui-orig
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D BLE_TX_POWER=0
;  -D BLE_DEBUG_LOGGING=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
  -D OFFLINE_QUEUE_SIZE=256
  -D DISPLAY_CLASS=NullDisplayDriver
  -D PIN_BUZZER=25
  -D PIN_BUZZER_EN=37      ; P1/5 - required for T1000-E
  -D ADVERT_NAME='"@@MAC"'
build_src_filter = ${t1000-e.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<helpers/ui/buzzer.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-orig/*.cpp>
lib_deps = ${t1000-e.lib_deps}
  densaugeo/base64 @ ~1.4.0
  stevemarple/MicroNMEA @ ^2.0.6
  end2endzone/NonBlockingRTTTL@^1.3.0

[env:t1000e_kiss_modem]
extends = t1000-e
build_src_filter = ${t1000-e.build_src_filter}
  +<../examples/kiss_modem/>
