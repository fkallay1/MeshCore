[SenseCap_Solar]
extends = nrf52_base
board = seeed_sensecap_solar
board_build.ldscript = boards/nrf52840_s140_v7.ld
build_flags = ${nrf52_base.build_flags}
  ${sensor_base.build_flags}
  -I lib/nrf52/s140_nrf52_7.3.0_API/include
  -I lib/nrf52/s140_nrf52_7.3.0_API/include/nrf52
  -I variants/sensecap_solar
  -I src/helpers/nrf52
  -D NRF52_PLATFORM=1
  -D USE_SX1262
  -D NRF52_POWER_MANAGEMENT
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D P_LORA_TX_LED=12
  -D P_LORA_DIO_1=1
  -D P_LORA_RESET=2
  -D P_LORA_BUSY=3
  -D P_LORA_NSS=4
  -D PIN_USER_BTN=PIN_BUTTON1
  -D LORA_TX_POWER=22
  -D SX126X_RXEN=5
  -D SX126X_TXEN=RADIOLIB_NC
  -D SX126X_DIO2_AS_RF_SWITCH=1
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D ENV_INCLUDE_GPS=1
build_src_filter = ${nrf52_base.build_src_filter}
  +<helpers/*.cpp>
  +<helpers/sensors>
  +<../variants/sensecap_solar>
debug_tool = jlink
upload_protocol = nrfutil
lib_deps =
  ${nrf52_base.lib_deps}
  ${sensor_base.lib_deps}

[env:SenseCap_Solar_repeater]
extends = SenseCap_Solar
build_flags =
  ${SenseCap_Solar.build_flags}
  -D ADVERT_NAME='"SenseCap_Solar Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${SenseCap_Solar.build_src_filter}
  +<../examples/simple_repeater/*.cpp>

; ── Repeater s LoRa-FOTA (delta-patch cez LoRa, len nRF52840) ──────────────
; Pozn.: pre FOTA flasher MUSÍ app flash končiť na 0xD4000 → v7_extrafs.ld
; (rovnako ako companion_radio). Flasher beží z 0xEB000, OTA FS @ 0xD4000.
; Pred prvým buildom vygeneruj flasher blob:
;   BOARD_FLASHER=xiao python examples/simple_repeater/nrffota/tools/build_flasher.py
; Pozn.: wire hodnoty ostávajú pôvodné kvôli kompatibilite — kanál '#fkotanrf'
; (hash 0xA4), FOTA_PKT_* bajty, FOTA_MAGIC. CLI prijíma 'ota' aj 'fota'.
[env:SenseCap_Solar_repeater_fota]
extends = SenseCap_Solar
board_build.ldscript = boards/nrf52840_s140_v7_extrafs.ld
board_upload.maximum_size = 708608
extra_scripts =
  create-uf2.py                        ; registruje target create_uf2 (inak prepíšeme zdedený z nrf52_base)
  pre:test_nrf-fota/gen_build_info.py
  post:test_nrf-fota/gen_fw_trailer.py
  post:test_nrf-fota/gen_fotapkg_hook.py
build_flags =
  ${SenseCap_Solar.build_flags}
  -D ADVERT_NAME='"SenseCap_Solar Repeater FOTA"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D WITH_LORA_FOTA=1
  -D FOTA_SOFTDEVICE_V7=1           ; SenseCap = s140 v7 → app base 0x27000 (nie 0x26000); inak SHA running fw aj flasher cielia zlú adresu
  -D FK_DEBUG=1                    ; diagnostika RX (ISR counter, CRC výpis) — zakomentuj na vypnutie
  -Wl,-u,fw_id_trailer            ; udrž FwId trailer pri --gc-sections (nikto ho nereferencuje)
  -D HPATCH_LITE_INCLUDE_DECOMPRESS=0
  -D FOTA_CHANNEL_NAME='"#fkotanrf"'
  -I examples/simple_repeater/nrffota
  -I examples/simple_repeater/nrffota/hpatchlite
  -I test_nrf-fota
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${SenseCap_Solar.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
  +<../examples/simple_repeater/nrffota/*.cpp>
  +<../examples/simple_repeater/nrffota/puff_stream.c>
  +<../examples/simple_repeater/nrffota/hpatchlite/hpatch_lite.c>

[env:SenseCap_Solar_room_server]
extends = SenseCap_Solar
build_flags =
  ${SenseCap_Solar.build_flags}
  -D ADVERT_NAME='"SenseCap_Solar Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${SenseCap_Solar.build_src_filter}
  +<../examples/simple_room_server/*.cpp>

[env:SenseCap_Solar_companion_radio_ble]
extends = SenseCap_Solar
board_build.ldscript = boards/nrf52840_s140_v7_extrafs.ld
board_upload.maximum_size = 708608
build_flags =
  ${SenseCap_Solar.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
;  -D BLE_DEBUG_LOGGING=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${SenseCap_Solar.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${SenseCap_Solar.lib_deps}
  densaugeo/base64 @ ~1.4.0

