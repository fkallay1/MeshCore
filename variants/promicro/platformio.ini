[Promicro]
extends = nrf52_base
board = promicro_nrf52840
build_flags = ${nrf52_base.build_flags}
  -I variants/promicro
  -D PROMICRO
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D PIN_BOARD_SCL=7
  -D PIN_BOARD_SDA=8
  -D PIN_OLED_RESET=-1
  -D PIN_USER_BTN=6
  -D PIN_GPS_RX=3
  -D PIN_GPS_TX=4
  -D PIN_GPS_EN=5
  -D ENV_INCLUDE_GPS=1
  -D ENV_INCLUDE_AHTX0=1
  -D ENV_INCLUDE_BME280=1
  -D ENV_INCLUDE_BMP280=1
  -D ENV_INCLUDE_INA3221=1
  -D ENV_INCLUDE_INA219=1
build_src_filter = ${nrf52_base.build_src_filter}
  +<helpers/sensors>
  +<../variants/promicro>
lib_deps= ${nrf52_base.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13
  adafruit/Adafruit INA3221 Library @ ^1.0.1
  adafruit/Adafruit INA219 @ ^1.2.3
  adafruit/Adafruit AHTX0 @ ^2.0.5
  adafruit/Adafruit BME280 Library @ ^2.3.0
  adafruit/Adafruit BMP280 Library@^2.6.8
  stevemarple/MicroNMEA @ ^2.0.6

[env:ProMicro_repeater]
extends = Promicro
build_src_filter = ${Promicro.build_src_filter}
  +<../examples/simple_repeater>
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
build_flags =
  ${Promicro.build_flags}
  -D ADVERT_NAME='"ProMicro Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D DISPLAY_CLASS=SSD1306Display
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
lib_deps = ${Promicro.lib_deps}
  adafruit/RTClib @ ^2.1.3

;en: ── Repeater with LoRa-FOTA (delta-patch over LoRa, nRF52840 only) ────────
;en: Note: the FOTA flasher REQUIRES the app flash to end at 0xD4000 → extrafs.ld
;en: (same as companion_radio). Flasher runs from 0xEB000, FOTA FS @ 0xD4000.
;en: Before the first build generate the flasher blob:
;en:   python examples/simple_repeater/nrffota/tools/build_flasher.py
;sk: ── Repeater s LoRa-FOTA (delta-patch cez LoRa, len nRF52840) ─────────────
;sk: Pozn.: pre FOTA flasher MUSÍ app flash končiť na 0xD4000 → extrafs.ld
;sk: (rovnako ako companion_radio). Flasher beží z 0xEB000, FOTA FS @ 0xD4000.
;sk: Pred prvým buildom vygeneruj flasher blob:
;sk:   python examples/simple_repeater/nrffota/tools/build_flasher.py
[env:ProMicro_repeater_fota]
extends = Promicro
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
extra_scripts =
  create-uf2.py                        ;en: registers the create_uf2 target (otherwise we override the one inherited from nrf52_base)
  pre:test_nrf-fota/gen_build_info.py
  post:test_nrf-fota/gen_fw_trailer.py
  post:test_nrf-fota/gen_fotapkg_hook.py
build_src_filter = ${Promicro.build_src_filter}
  +<../examples/simple_repeater>
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
build_flags =
  ${Promicro.build_flags}
  -D ADVERT_NAME='"ProMicro Repeater FOTA"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D DISPLAY_CLASS=SSD1306Display
  -D WITH_LORA_FOTA=1
  -D LORA_RADIO_WATCHDOG=30000     ;en: OBSERVATION only (see LORA_RADIO_DIAG_ONLY) - no recovery action
  -D LORA_RADIO_DIAG_ONLY=1        ;en: measure + report, never act
  -D LORA_RADIO_DIAG_CLI=1         ;en: 'fk rssi|hammer|reinit'
  -D FK_SERIAL_WAIT_DTR=2000       ;en: setup() waits up to 2s for host to open serial (DTR) — boot log reaches an attached terminal instead of racing a blind delay
  -D FOTA_MESHCORE_BUILD=1         ;en: platform select for shared nrffota sources (vs FOTA_ZEPHCORE_BUILD)
  -D FOTA_DEBUG=1                  ;en: FOTA diagnostics on Serial (FOTA_DEBUG_PRINT, nrffota/FotaDebug.h) — comment out to disable
  -D FK_DEBUG_STACKTRACE=1         ;en: TEMPORARY stack measurement in heartbeat — drop at the end (with the line below)
  -D INCLUDE_pxTaskGetStackStart=1 ;en: exposes the loop-stack bottom → current stack usage (nowused)
  -D FK_DEBUG=1                    ;en: RX diagnostics (ISR counter, CRC print) — comment out to disable
  -Wl,-u,fw_id_trailer            ;en: keep the FwId trailer with --gc-sections (nothing references it)
  -D HPATCH_LITE_INCLUDE_DECOMPRESS=0
  -D FOTA_CHANNEL_NAME='"#fkotanrf"'
  -D FOTA_LANG_SK=1                ;en: Slovak CLI reply texts (FotaTexts.h); without the flag = English
  -I examples/simple_repeater/nrffota
  -I examples/simple_repeater/nrffota/hpatchlite
  -I test_nrf-fota
  -D FK_DEBUG_MAXPATH=4
;  -D LORA_FREQ=869.525
;  -D LORA_SF=7
;  -D LORA_BW=62.5
;  -D LORA_CR=5
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
lib_deps = ${Promicro.lib_deps}
  adafruit/RTClib @ ^2.1.3
upload_port = COM5      ; FKFK Port použitý iba pre nahrávanie kódu
monitor_port = COM5     ; FKFK Port použitý iba pre Serial Monitor

[env:ProMicro_repeater_bridge_rs232_serial1]
