[rak3401]
extends = nrf52_base
board = rak3401
board_check = true
build_flags = ${nrf52_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/rak3401
  -D RAK_3401
  -D RAK_BOARD
  -D NRF52_POWER_MANAGEMENT
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D SX126X_REGISTER_PATCH=1       ; Patch register 0x8B5 for improved RX with SKY66122 FEM
build_src_filter = ${nrf52_base.build_src_filter}
  +<../variants/rak3401>
  +<helpers/sensors>
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
lib_deps =
  ${nrf52_base.lib_deps}
  ${sensor_base.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13
  sparkfun/SparkFun u-blox GNSS Arduino Library@^2.2.27

[env:RAK_3401_repeater]
extends = rak3401
build_flags =
  ${rak3401.build_flags}
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"RAK3401 1W Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  ;-D MESH_PACKET_LOGGING=1
  ;-D MESH_DEBUG=1
build_src_filter = ${rak3401.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_repeater>

;en: ── Repeater with LoRa-FOTA (delta-patch over LoRa, nRF52840 only) ────────
;en: Note: the FOTA flasher REQUIRES the app flash to end at 0xD4000 → v6_extrafs.ld
;en: (same as companion_radio). Flasher runs from 0xEB000, FOTA FS @ 0xD4000.
;en: RAK3401 ("RAK 1W") uses SoftDevice s140 v6 (app base 0x26000) — v6 ldscript.
;en: Before the first build generate the flasher blob:
;en:   python examples/simple_repeater/nrffota/tools/build_flasher.py  (one board-agnostic blob)
;en: Note: wire values stay unchanged for compatibility — channel '#fkotanrf'
;en: (hash 0xA4), FOTA_PKT_* bytes, FOTA_MAGIC. CLI accepts both 'ota' and 'fota'.
;sk: ── Repeater s LoRa-FOTA (delta-patch cez LoRa, len nRF52840) ─────────────
;sk: Pozn.: pre FOTA flasher MUSÍ app flash končiť na 0xD4000 → v6_extrafs.ld
;sk: (rovnako ako companion_radio). Flasher beží z 0xEB000, FOTA FS @ 0xD4000.
;sk: RAK3401 („RAK 1W") má SoftDevice s140 v6 (app base 0x26000) — v6 ldscript.
;sk: Pred prvým buildom vygeneruj flasher blob:
;sk:   python examples/simple_repeater/nrffota/tools/build_flasher.py  (jeden board-agnostický blob)
;sk: Pozn.: wire hodnoty ostávajú pôvodné kvôli kompatibilite — kanál '#fkotanrf'
;sk: (hash 0xA4), FOTA_PKT_* bajty, FOTA_MAGIC. CLI prijíma 'ota' aj 'fota'.
[env:RAK_3401_repeater_fota]
extends = rak3401
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
custom_fota_device = rak3401           ;en: fotapkg archive name — the PIOENV first segment "rak" would collide with RAK_4631
                                       ;sk: meno vo fotapkg archíve — prvý segment PIOENV "rak" by kolidoval s RAK_4631
extra_scripts =
  create-uf2.py                        ;en: registers the create_uf2 target (otherwise we override the one inherited from nrf52_base)
  pre:test_nrf-fota/gen_build_info.py
  post:test_nrf-fota/gen_fw_trailer.py
  post:test_nrf-fota/gen_fotapkg_hook.py
build_flags =
  ${rak3401.build_flags}
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"RAK3401 1W Repeater FOTA"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D WITH_LORA_FOTA=1
  -D FKPR_RADIO_WATCHDOG=30000     ;en: detect a dead receiver and re-init it (verified on SX1262 and LR2021)
  -D FK_RADIO_DIAG_CLI=1           ;en: radio-agnostic bench CLI - fk rssi|hammer|reinit
  -D FK_SERIAL_WAIT_DTR=2000       ;en: setup() waits up to 2s for host to open serial (DTR) — boot log reaches an attached terminal instead of racing a blind delay
  -D FOTA_MESHCORE_BUILD=1
  -D FOTA_DEBUG=1                  ;en: FOTA diagnostics on Serial (FOTA_DEBUG_PRINT, nrffota/FotaDebug.h) — comment out to disable
  -D FK_DEBUG_STACKTRACE=1         ;en: TEMPORARY stack measurement in heartbeat — drop at the end (with the line below)
  -D INCLUDE_pxTaskGetStackStart=1 ;en: exposes the loop-stack bottom → current stack usage (nowused)
  -D FK_DEBUG=1                    ;en: RX diagnostics (ISR counter, CRC print) — comment out to disable
  -Wl,-u,fw_id_trailer            ;en: keep the FwId trailer with --gc-sections (nothing references it)
  -D HPATCH_LITE_INCLUDE_DECOMPRESS=0
  -D FOTA_CHANNEL_NAME='"#fkotanrf"'
  -D FOTA_LANG_SK=1                ;en: Slovak CLI reply texts (FotaTexts.h); without the flag = English
  -I examples/simple_repeater/nrffota
  -I examples/simple_repeater/nrffota/hpatchlite
  -I test_nrf-fota
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${rak3401.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
  +<../examples/simple_repeater/nrffota/*.cpp>
  +<../examples/simple_repeater/nrffota/puff_stream.c>
  +<../examples/simple_repeater/nrffota/hpatchlite/hpatch_lite.c>

[env:RAK_3401_room_server]
extends = rak3401
build_flags =
  ${rak3401.build_flags}
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"Test Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
  ;-D MESH_PACKET_LOGGING=1
  ;-D MESH_DEBUG=1
build_src_filter = ${rak3401.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_room_server>

[env:RAK_3401_companion_radio_usb]
extends = rak3401
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags =
  ${rak3401.build_flags}
  -I examples/companion_radio/ui-new
  -D PIN_USER_BTN_ANA=31
  -D DISPLAY_CLASS=SSD1306Display
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D ENABLE_USB_INTERFACE
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
build_src_filter = ${rak3401.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${rak3401.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:RAK_3401_companion_radio_ble]
extends = rak3401
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags =
  ${rak3401.build_flags}
  -I examples/companion_radio/ui-new
  -D PIN_USER_BTN_ANA=31
  -D DISPLAY_CLASS=SSD1306Display
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
  ;-D MESH_PACKET_LOGGING=1
  ;-D MESH_DEBUG=1
build_src_filter = ${rak3401.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${rak3401.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:RAK_3401_terminal_chat]
extends = rak3401
build_flags =
  ${rak3401.build_flags}
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=1
  ;-D MESH_PACKET_LOGGING=1
  ;-D MESH_DEBUG=1
build_src_filter = ${rak3401.build_src_filter}
  +<../examples/simple_secure_chat/main.cpp>
lib_deps =
  ${rak3401.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:RAK_3401_sensor]
extends = rak3401
build_flags =
  ${rak3401.build_flags}
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"RAK3401 Sensor"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  ;-D MESH_PACKET_LOGGING=1
  ;-D MESH_DEBUG=1
build_src_filter = ${rak3401.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_sensor>

[env:RAK_3401_kiss_modem]
extends = rak3401
build_src_filter = ${rak3401.build_src_filter}
  +<../examples/kiss_modem/>
